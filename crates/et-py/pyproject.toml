[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "emergent-tactics"
version = "0.1.0"
description = "Rust game engine and ISMCTS bindings for Emergent Tactics"
license = "MIT"
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "emergent_tactics"
