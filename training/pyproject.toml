[project]
name = "emergent-tactics-training"
version = "0.1.0"
description = "Self-play, training, export and arena tooling for Emergent Tactics"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "numpy>=2",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pyyaml>=6",
    "tqdm>=4",
    "emergent-tactics",
]

[project.scripts]
et-selfplay = "emergent_tactics_training.selfplay:main"
et-train = "emergent_tactics_training.train:main"
et-export = "emergent_tactics_training.export:main"
et-arena = "emergent_tactics_training.arena:main"

[tool.uv.sources]
emergent-tactics = { path = "../crates/et-py", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "maturin>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emergent_tactics_training"]
